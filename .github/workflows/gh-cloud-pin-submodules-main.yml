name: Update submodule pointers on main

run-name: Pin dx-runtime submodule pointers to origin/main

on:
  workflow_dispatch:
    inputs:
      submodule_names:
        description: 'Comma-separated submodule paths (default: all leaf submodules)'
        required: false
        default: 'dx_rt,dx_app,dx_stream,dx_fw,dx_rt_npu_linux_driver'
        type: string
      branch:
        description: 'Branch to update submodule pointers on'
        required: false
        default: 'main'
        type: string
      commit_message:
        description: 'Commit message for submodule pointer update'
        required: false
        default: 'ci: update submodule pointers to main'
        type: string

permissions: write-all

jobs:
  pin:
    uses: DEEPX-AI/do_workflows-central/.github/workflows/pin-submodules-to-main.yml@main
    with:
      target_repo: DEEPX-AI/dx-runtime
      submodule_names: ${{ github.event.inputs.submodule_names }}
      branch: ${{ github.event.inputs.branch }}
      commit_message: ${{ github.event.inputs.commit_message }}
    secrets:
      token: ${{ secrets.GC_DCI_TOKEN }}
